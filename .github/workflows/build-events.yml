name: Build events manifest

on:
  push:
    branches: [main]
    paths:
      - "events/**"
      - "scripts/build_events.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate events.json
        run: python scripts/build_events.py

      - name: Commit events.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Auto-update events.json"
          git push
